<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prize Spinning Wheel</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 2rem 1rem;
    background: #faf8f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    box-sizing: border-box;
  }
  h1 { font-size: 22px; margin: 0 0 0.5rem 0; color: #2b2b2b; text-align: center; }

  /* Selection screen */
  #selectScreen { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
  #selectScreen p { color: #555; margin: 0; font-size: 15px; }
  .choice-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .choice-btn {
    font-size: 17px; padding: 18px 32px; font-weight: 700; border-radius: 14px;
    border: 2px solid #d97757; background: white; color: #d97757; cursor: pointer; min-width: 160px;
  }
  .choice-btn:hover { background: #fdf1ea; }
  .choice-btn.friends { border-color: #7c66d9; color: #7c66d9; }
  .choice-btn.friends:hover { background: #f1eefb; }
  .choice-btn.custom { border-color: #2f9e6f; color: #2f9e6f; min-width: unset; padding: 12px 20px; font-size: 15px; }
  .choice-btn.custom:hover { background: #eafaf2; }

  .custom-row {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    border-top: 1px solid #e4dfd6; padding-top: 1rem; margin-top: 0.25rem;
    width: 100%; max-width: 340px;
  }
  .custom-inputs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #customCount { width: 64px; font-size: 16px; padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; text-align: center; }
  #customError { color: #c0392b; font-size: 13px; display: none; }

  /* Wheel screen */
  #wheelScreen { display: none; flex-direction: column; align-items: center; gap: 1rem; width: 100%; }
  .main-area {
    display: flex; gap: 2rem; align-items: flex-start; justify-content: center;
    flex-wrap: wrap; width: 100%; max-width: 760px;
  }
  .wheel-col { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .wheel-wrap { position: relative; width: 340px; height: 340px; max-width: 85vw; max-height: 85vw; }
  .pointer {
    position: absolute; top: -4px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
    border-top: 22px solid #2b2b2b; z-index: 2; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25));
  }
  canvas {
    display: block; width: 100%; height: 100%; border-radius: 50%;
    border: 1px solid #ddd8d0; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  button.action {
    font-size: 16px; padding: 10px 28px; font-weight: 600; border-radius: 999px;
    border: none; background: #d97757; color: white; cursor: pointer;
  }
  button.action:hover { background: #c2663f; }
  button.action:disabled { opacity: 0.6; cursor: not-allowed; }
  #backBtn {
    background: transparent; color: #888; border: 1px solid #ccc; font-weight: 500;
    font-size: 13px; padding: 6px 16px; border-radius: 999px; cursor: pointer; align-self: flex-start;
  }
  #backBtn:hover { background: #f2f0ec; }
  #resultBox { min-height: 28px; font-size: 18px; font-weight: 600; color: #b45309; text-align: center; }

  /* Mapping table */
  .mapping-col {
    display: flex; flex-direction: column; gap: 10px;
    background: white; border: 1px solid #e4dfd6; border-radius: 12px;
    padding: 16px 18px; min-width: 220px; max-width: 280px;
    max-height: 420px; overflow-y: auto;
  }
  .mapping-col h3 { margin: 0 0 4px 0; font-size: 15px; color: #2b2b2b; }
  .mapping-row { display: flex; align-items: center; gap: 8px; }
  .mapping-row .slot-num {
    width: 28px; height: 28px; border-radius: 50%; background: #f0ece3;
    color: #6b6b6b; font-weight: 700; font-size: 13px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mapping-row input {
    flex: 1; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #ccc; min-width: 0;
  }
  #applyBtn { margin-top: 4px; font-size: 14px; padding: 8px 20px; align-self: center; }
</style>
</head>
<body>

  <h1>Prize Wheel</h1>

  <!-- Selection screen -->
  <div id="selectScreen">
    <p>Who's this spin for?</p>
    <div class="choice-row">
      <button class="choice-btn friends" id="friendsBtn">Friends only</button>
      <button class="choice-btn" id="classBtn">Whole Class</button>
    </div>

    <div class="custom-row">
      <p style="margin-top:0.5rem;">...or make your own wheel:</p>
      <div class="custom-inputs">
        <input type="number" id="customCount" min="2" max="50" value="8" />
        <span style="color:#777; font-size:14px;">slots</span>
        <button class="choice-btn custom" id="customBtn">Create wheel</button>
      </div>
      <p id="customError">Please enter a number between 2 and 50.</p>
    </div>
  </div>

  <!-- Wheel screen -->
  <div id="wheelScreen">
    <button id="backBtn">&larr; Back to selection</button>

    <div class="main-area">
      <div class="wheel-col">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <canvas id="wheel" width="340" height="340"></canvas>
        </div>
        <button class="action" id="spinBtn">&#9654; Spin the wheel</button>
        <div id="resultBox"></div>
      </div>

      <div class="mapping-col">
        <h3>Names for each slot</h3>
        <div id="nameInputs"></div>
        <button class="action" id="applyBtn">&#10003; Apply names</button>
      </div>
    </div>
  </div>

<script>
(function(){
  var nameSets = {
    friends: ["Arisha","Sophia","Shrinika","Hooriya"],
    class: ["Hooriya","Arielle","Shrinika","Natalia","Lincoln","Michael","Sophia",
      "Arisha","Ashton","Liam","Luke","Carter","Lucy","Prisha","Theo","Garret","Agastya",
      "Morgan","Belle","Kynlee","William"]
  };

  // Hard-coded hex colors — no CSS theme variables, this file has to stand
  // on its own with nothing else defining them.
  var sliceFills = ["#CECBF6","#9FE1CB","#F5C4B3","#F4C0D1","#FAC775"];
  var sliceTextColors = ["#3C3489","#085041","#712B13","#72243E","#633806"];

  var names = [];       // names[i] = the name mapped to slot (i+1)
  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var size = 340, cx = size/2, cy = size/2, r = size/2 - 6;
  var currentRotation = 0;
  var spinning = false;
  var POINTER_ANGLE = -Math.PI/2;

  function mod(a,m){ return ((a % m) + m) % m; }

  function buildMappingTable(){
    var container = document.getElementById('nameInputs');
    container.innerHTML = '';
    for (var i=0;i<names.length;i++){
      var row = document.createElement('div');
      row.className = 'mapping-row';

      var badge = document.createElement('div');
      badge.className = 'slot-num';
      badge.textContent = (i+1);

      var inp = document.createElement('input');
      inp.type = 'text';
      inp.value = names[i];
      inp.setAttribute('data-idx', i);

      row.appendChild(badge);
      row.appendChild(inp);
      container.appendChild(row);
    }
  }

  // The wheel itself only ever shows the slot number — the name lookup
  // lives entirely in the mapping table beside it.
  function drawWheel(rotation){
    ctx.clearRect(0,0,size,size);
    var n = names.length;
    var slice = (2*Math.PI)/n;
    var fontSize = n > 24 ? 12 : 16;
    for (var i=0;i<n;i++){
      var start = rotation + i*slice;
      var end = start + slice;
      var fill = sliceFills[i % sliceFills.length];
      var textColor = sliceTextColors[i % sliceTextColors.length];

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,r,start,end);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx,cy);
      ctx.rotate(start + slice/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = textColor;
      ctx.font = '700 ' + fontSize + 'px -apple-system, sans-serif';
      ctx.fillText(String(i+1), r - 14, 5);
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(cx,cy,r,0,2*Math.PI);
    ctx.strokeStyle = '#c9c2b8';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function indexUnderPointer(rotation){
    var n = names.length;
    var slice = (2*Math.PI)/n;
    var rel = mod(POINTER_ANGLE - rotation, 2*Math.PI);
    var i = Math.floor(rel/slice);
    if (i >= n) i = n-1;
    if (i < 0) i = 0;
    return i;
  }

  function easeOutCubic(t){ return 1 - Math.pow(1-t,3); }

  function spin(){
    if (spinning) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;
    document.getElementById('resultBox').textContent = '';
    var extraSpins = 5 + Math.random()*2;
    var randomOffset = Math.random()*2*Math.PI;
    var startRotation = currentRotation;
    var delta = extraSpins*2*Math.PI + randomOffset;
    var targetRotation = startRotation + delta;
    var duration = 4200;
    var startTime = null;

    function frame(ts){
      if (!startTime) startTime = ts;
      var elapsed = ts - startTime;
      var t = Math.min(elapsed/duration, 1);
      var eased = easeOutCubic(t);
      currentRotation = startRotation + delta*eased;
      drawWheel(currentRotation);
      if (t < 1){
        requestAnimationFrame(frame);
      } else {
        currentRotation = targetRotation;
        drawWheel(currentRotation);
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        var winnerIdx = indexUnderPointer(currentRotation);
        var winnerName = names[winnerIdx] || ('Slot ' + (winnerIdx+1));
        document.getElementById('resultBox').innerHTML =
          '&#127881; Slot ' + (winnerIdx+1) + ' &mdash; ' + winnerName + ' wins the prize!';
      }
    }
    requestAnimationFrame(frame);
  }

  function placeholderNames(count){
    var arr = [];
    for (var i=1;i<=count;i++){ arr.push('Player ' + i); }
    return arr;
  }

  function openWheel(nameArray){
    names = nameArray.slice();
    currentRotation = 0;
    document.getElementById('resultBox').textContent = '';
    document.getElementById('selectScreen').style.display = 'none';
    document.getElementById('wheelScreen').style.display = 'flex';
    buildMappingTable();
    drawWheel(currentRotation);
  }

  function backToSelect(){
    document.getElementById('wheelScreen').style.display = 'none';
    document.getElementById('selectScreen').style.display = 'flex';
  }

  document.getElementById('friendsBtn').addEventListener('click', function(){ openWheel(nameSets.friends); });
  document.getElementById('classBtn').addEventListener('click', function(){ openWheel(nameSets.class); });

  document.getElementById('customBtn').addEventListener('click', function(){
    var val = parseInt(document.getElementById('customCount').value, 10);
    var errorEl = document.getElementById('customError');
    if (!val || val < 2 || val > 50){
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';
    openWheel(placeholderNames(val));
  });

  document.getElementById('backBtn').addEventListener('click', backToSelect);
  document.getElementById('spinBtn').addEventListener('click', spin);
  document.getElementById('applyBtn').addEventListener('click', function(){
    var inputs = document.querySelectorAll('#nameInputs input');
    var newNames = [];
    inputs.forEach(function(inp){
      newNames.push(inp.value.trim() || 'Player');
    });
    names = newNames;
    drawWheel(currentRotation);
  });
})();
</script>
</body>
</html>
